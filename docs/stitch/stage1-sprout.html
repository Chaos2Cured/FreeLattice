<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_11 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_11" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_11');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Stage 1: Sprout & Young Sapling (Lyra / Initial Note Seedling)
// Self-contained Three.js interactive asset
(function() {
  const container = document.getElementById('threejs-container-sapling') || document.body;
  const getW = () => container.clientWidth || window.innerWidth || 600;
  const getH = () => container.clientHeight || window.innerHeight || 600;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a130f, 0.02);

  const camera = new THREE.PerspectiveCamera(45, getW() / getH(), 0.1, 500);
  camera.position.set(0, 5, 12);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(getW(), getH());
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const amb = new THREE.AmbientLight(0x132a20, 2.5);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0x6ee7b7, 3.0);
  dir.position.set(10, 20, 10);
  dir.castShadow = true;
  scene.add(dir);
  const glow = new THREE.PointLight(0x34d399, 3.5, 15);
  glow.position.set(0, 2.5, 0);
  scene.add(glow);

  // Mound / Soil Pedestal
  const soilGeo = new THREE.CylinderGeometry(5, 5.5, 0.8, 32);
  const soilMat = new THREE.MeshLambertMaterial({ color: 0x0c1612 });
  const soil = new THREE.Mesh(soilGeo, soilMat);
  soil.position.y = -0.4;
  soil.receiveShadow = true;
  scene.add(soil);

  // Soil pulse ring
  const ringGeo = new THREE.RingGeometry(2.5, 2.7, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  scene.add(ring);

  // Sapling Group
  const sapling = new THREE.Group();
  scene.add(sapling);

  // Stem (Curved spline tube)
  const stemCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0.15, 1.2, 0.1),
    new THREE.Vector3(-0.1, 2.4, -0.05),
    new THREE.Vector3(0, 3.6, 0)
  ]);
  const stemGeo = new THREE.TubeGeometry(stemCurve, 20, 0.12, 8, false);
  const stemMat = new THREE.MeshLambertMaterial({ color: 0x22c55e });
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.castShadow = true;
  sapling.add(stem);

  // Cotyledon / Sprouting Seed Leaves
  const leafMat = new THREE.MeshStandardMaterial({
    color: 0x34d399,
    emissive: 0x065f46,
    emissiveIntensity: 0.4,
    roughness: 0.3,
    side: THREE.DoubleSide
  });

  function createLeaf(scaleX, scaleY, rotZ, yPos) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.bezierCurveTo(0.6, 0.4, 0.8, 1.2, 0, 2.0);
    shape.bezierCurveTo(-0.8, 1.2, -0.6, 0.4, 0, 0);

    const geo = new THREE.ShapeGeometry(shape);
    const mesh = new THREE.Mesh(geo, leafMat);
    mesh.scale.set(scaleX, scaleY, 1);
    mesh.position.y = yPos;
    mesh.rotation.z = rotZ;
    mesh.rotation.x = 0.3;
    mesh.castShadow = true;
    return mesh;
  }

  const leaf1 = createLeaf(0.7, 0.8, 0.7, 3.3);
  const leaf2 = createLeaf(0.7, 0.8, -0.7, 3.3);
  leaf2.rotation.y = Math.PI;
  const leaf3 = createLeaf(0.5, 0.6, 0.2, 3.6);
  leaf3.rotation.x = -0.4;
  sapling.add(leaf1, leaf2, leaf3);

  // Sprouting Seed Shell (split seed pod at base)
  const podGeo = new THREE.DodecahedronGeometry(0.35, 1);
  const podMat = new THREE.MeshLambertMaterial({ color: 0x78350f });
  const podL = new THREE.Mesh(podGeo, podMat);
  podL.position.set(-0.25, 0.15, 0);
  podL.scale.set(0.6, 1.2, 0.7);
  podL.rotation.z = 0.4;
  const podR = podL.clone();
  podR.position.x = 0.25;
  podR.rotation.z = -0.4;
  sapling.add(podL, podR);

  // Sprouting Bioluminescent Core / Dewdrop
  const dewGeo = new THREE.SphereGeometry(0.25, 16, 16);
  const dewMat = new THREE.MeshBasicMaterial({ color: 0xa7f3d0 });
  const dew = new THREE.Mesh(dewGeo, dewMat);
  dew.position.set(0, 3.6, 0.1);
  sapling.add(dew);

  // Spores
  const pCount = 60;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount * 3; i += 3) {
    pPos[i] = (Math.random() - 0.5) * 6;
    pPos[i + 1] = Math.random() * 5 + 0.5;
    pPos[i + 2] = (Math.random() - 0.5) * 6;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ size: 0.2, color: 0x6ee7b7, transparent: true, opacity: 0.8 });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // Orbit controls
  let isDown = false, px = 0, py = 0, angle = 0, camY = 5, dist = 12;
  window.addEventListener('mousedown', e => { isDown = true; px = e.clientX; py = e.clientY; });
  window.addEventListener('mousemove', e => {
    if (!isDown) return;
    angle -= (e.clientX - px) * 0.01;
    camY = Math.max(1, Math.min(9, camY + (e.clientY - py) * 0.02));
    px = e.clientX; py = e.clientY;
  });
  window.addEventListener('mouseup', () => isDown = false);
  window.addEventListener('resize', () => {
    camera.aspect = getW() / getH();
    camera.updateProjectionMatrix();
    renderer.setSize(getW(), getH());
  });

  let clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    if (!isDown) angle += 0.008;
    camera.position.x = dist * Math.sin(angle);
    camera.position.z = dist * Math.cos(angle);
    camera.position.y = camY;
    camera.lookAt(0, 2, 0);

    sapling.rotation.y = Math.sin(t * 0.5) * 0.08;
    dew.scale.setScalar(1 + Math.sin(t * 3) * 0.15);
    glow.intensity = 2.5 + Math.sin(t * 2) * 1.0;
    ring.scale.setScalar(1 + Math.sin(t * 1.5) * 0.05);

    renderer.render(scene, camera);
  }
  loop();
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_11 -->
</body>
</html>
