# Copyright (C) 2026 Samuel Jackson Grim
# Licensed under AGPL-3.0-or-later.
#
# On a v* tag (and on workflow_dispatch): run the local gate, build a native
# SEA binary on each OS, smoke --mcp on that same runner, and — for a tag
# push — attach all three plus SHA256SUMS to a GitHub Release.
#
# Why this workflow exists: SEA cannot cross-compile, and this project has
# no Mac hardware. macos-latest is the macOS build path. A red smoke must
# never reach a Release. Binaries are UNSIGNED; signing is the RM-11
# remainder. CI cannot fix Gatekeeper / SmartScreen.
#
# Tag policy (ci/release-meta.js): v0.2.0 matches package.json 0.2.0 (the
# release-tag source). v0.2.0-rc1 is a prerelease of the same core version,
# so an rc tag is safe to push without bumping package.json. A dirty tag
# (v0.3.0 while package.json is 0.2.0) fails the gate before any build.
#
# Actions are pinned to full-length SHAs (supply-chain hygiene for a
# security-minded audience). Re-derive with:
#   gh api repos/actions/checkout/git/ref/tags/v7.0.1 --jq .object.sha
#
# Intel macOS is intentionally not in the matrix: Node SEA CI tests arm64
# and skips x64 (build-exe.js warns). We assert process.arch so a
# macos-latest image flip cannot silently ship the wrong Mac binary.

name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: gate (test + eval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Assert Node >= 22.5
        run: node ci/release-meta.js assert-runner --arch x64

      - name: Tag must match package.json
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node ci/release-meta.js check-tag "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Unit / regression suite
        run: node test.js

      - name: RM-00 golden (sqlite default)
        run: node eval/run.js

  build:
    name: build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: resonance-memory.exe
            expect_arch: x64
          - os: ubuntu-latest
            target: linux
            artifact: resonance-memory-linux-x64
            expect_arch: x64
          - os: macos-latest
            target: macos
            artifact: resonance-memory-macos-arm64
            expect_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Assert Node floor + runner arch
        run: node ci/release-meta.js assert-runner --arch ${{ matrix.expect_arch }}

      - name: Build native SEA
        run: node build-exe.js --target ${{ matrix.target }}

      - name: Assert staged artifact
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: node -e "const fs=require('fs'); const p=require('path').join('dist', process.env.ARTIFACT); if (!fs.existsSync(p)) { console.error('missing '+p); process.exit(1); } const n=fs.statSync(p).size; if (n < 1000000) { console.error(p+' is '+n+' bytes — a SEA binary is ~90 MB; refusing a stub'); process.exit(1); } console.log(p, n, 'bytes');"

      - name: Smoke --mcp (initialize + tools/list)
        run: node ci/smoke-exe.js dist/${{ matrix.artifact }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: github release
    needs: [gate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS (refuse a partial set)
        run: node ci/release-meta.js sha256sums --dir dist --out dist/SHA256SUMS --expect resonance-memory.exe,resonance-memory-linux-x64,resonance-memory-macos-arm64

      - name: Tag metadata
        id: tag
        run: node ci/release-meta.js check-tag "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: node ci/release-meta.js notes --tag "${{ github.ref_name }}" --out NOTES.md

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          FILES=(
            dist/resonance-memory.exe
            dist/resonance-memory-linux-x64
            dist/resonance-memory-macos-arm64
            dist/SHA256SUMS
          )
          for f in "${FILES[@]}"; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          TITLE="Resonance Memory ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets (--clobber) and refreshing notes."
            gh release upload "$TAG" "${FILES[@]}" --clobber
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file NOTES.md --prerelease --latest=false
            else
              gh release edit "$TAG" --title "$TITLE" --notes-file NOTES.md --prerelease=false
            fi
          else
            echo "Creating release $TAG (prerelease=$PRERELEASE)."
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes-file NOTES.md --prerelease --latest=false
            else
              gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes-file NOTES.md
            fi
          fi
